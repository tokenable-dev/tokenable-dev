<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokenable — Sign in</title>
<script src="support.js"></script>
</head>
<body>
<x-dc data-theme="dark">
<helmet>
<script src="ds-base.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root:root{ --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace; }
  :root{ --ink:#0e0e0e; --azure:rgb(26,111,255); --pos:rgb(0,200,100); --warn:rgb(234,130,0); --neg:rgb(228,55,74); --t2:rgba(255,255,255,0.55); --t3:rgba(255,255,255,0.35); --brand-400:#5B9AFF; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:#fff;font-family:var(--font-sans,'Inter',sans-serif);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  a{color:var(--azure);text-decoration:none;} a:hover{color:var(--brand-400);}
  .mono{font-family:var(--font-mono);}
  .wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .card{width:100%;max-width:440px;background:#191919;border-radius:20px;padding:36px;}
  .logo{height:26px;display:block;margin:0 auto 28px;}
  h1{margin:0 0 6px;font-size:24px;font-weight:700;letter-spacing:-0.02em;text-align:center;}
  .sub{margin:0 0 28px;font-size:14px;color:var(--t2);text-align:center;line-height:1.5;}
  .field{margin-bottom:14px;}
  .lbl{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--t2);font-weight:600;margin-bottom:7px;display:block;}
  .inp{width:100%;height:48px;padding:0 15px;background:#0e0e0e;border:0;border-radius:11px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.12);color:#fff;font-size:15px;outline:none;}
  .inp:focus{box-shadow:inset 0 0 0 1.5px var(--azure);}
  .seg{display:flex;gap:8px;margin-bottom:22px;background:#0e0e0e;border-radius:12px;padding:5px;}
  .seg button{flex:1;height:42px;border:0;background:transparent;color:var(--t2);font-family:var(--font-sans);font-size:14px;font-weight:600;border-radius:8px;cursor:pointer;transition:all 0.12s;}
  .seg button.on{background:var(--azure);color:#fff;}
  .btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;font-family:var(--font-sans);font-weight:600;transition:all 0.12s;border-radius:11px;}
  .btn--primary{background:var(--azure);color:#fff;} .btn--primary:hover{filter:brightness(1.08);}
  .btn--ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.18);} .btn--ghost:hover{background:rgba(255,255,255,0.06);}
  .note{font-size:12px;color:var(--t3);text-align:center;margin-top:16px;line-height:1.6;}
  .banner{border-radius:12px;padding:14px 16px;display:flex;gap:11px;align-items:flex-start;font-size:13px;line-height:1.55;margin-bottom:20px;}
  .banner--warn{background:rgba(234,130,0,0.08);box-shadow:inset 0 0 0 1px rgba(234,130,0,0.25);color:#F5B84E;}
  .demo{font-family:var(--font-mono);font-size:10px;letter-spacing:0.12em;color:var(--t3);text-align:center;margin-top:24px;padding-top:18px;border-top:1px dashed rgba(255,255,255,0.1);}
  [data-view]{display:none;} [data-view].on{display:block;}
</style>
</helmet>

  <div class="wrap">
    <div class="card">
      <img class="logo" src="images/logo-tokenable.svg" alt="Tokenable">

      <!-- SIGN IN -->
      <div data-view="signin" class="on">
        <h1>Sign in</h1>
        <p class="sub">Access the graded card market.</p>

        <div class="field"><label class="lbl">Email</label><input class="inp" id="email" type="email" value="you@example.com"></div>
        <div class="field"><label class="lbl">Password</label><input class="inp" type="password" value="••••••••••"></div>
        <button class="btn btn--primary" id="signin-btn" style="height:50px;width:100%;font-size:15px;margin-top:8px;">Sign in</button>
        <div class="note">New here? <a href="#">Create an account</a> · <a href="#">Forgot password?</a></div>

        <div class="demo">
          DEMO — partner flag on this account:
          <div style="display:flex;gap:6px;justify-content:center;margin-top:8px;">
            <button class="btn btn--ghost" id="demo-pending" style="height:30px;padding:0 12px;font-size:11px;">Partner: off</button>
            <button class="btn btn--ghost" id="demo-approved" style="height:30px;padding:0 12px;font-size:11px;">Partner: on</button>
            <a href="Admin-Partners.html" class="btn btn--ghost" style="height:30px;padding:0 12px;font-size:11px;">Open admin</a>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
setTimeout(function(){
  var $=function(id){return document.getElementById(id);};
  function show(v){ document.querySelectorAll('[data-view]').forEach(function(el){ el.classList.toggle('on', el.getAttribute('data-view')===v); }); }
  function setStatus(s){ try{ localStorage.setItem('tk_partner_status', s); }catch(e){} }

  document.addEventListener('click', function(e){
    // One unified sign-in. Partner status is an account flag, not a login type —
    // it only changes what the Sell flow offers.
    if(e.target.closest('#signin-btn')){
      try{ localStorage.setItem('tk-wallet','1'); localStorage.setItem('tk-wallet-ever','1'); }catch(_){}
      window.location.href='Portfolio.html';
      return;
    }
    if(e.target.closest('#demo-pending')){ setStatus('pending'); flash('Partner flag off'); return; }
    if(e.target.closest('#demo-approved')){ setStatus('approved'); flash('Partner flag on'); return; }
  });
  function flash(msg){ var b=$('demo-approved'); var host=b.parentElement.parentElement; var n=document.createElement('div'); n.textContent=msg; n.style.cssText='color:var(--pos);margin-top:8px;font-size:11px;'; host.appendChild(n); setTimeout(function(){ n.remove(); }, 1600); }
}, 300);
</script>
</x-dc>
</body>
</html>
