# develop / main push → ECR build → EC2 docker-compose pull
#
# GitHub Secrets (deploy only — keep these):
#   ECR_REGISTRY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   DEV_EC2_HOST, DEV_EC2_SSH_KEY (develop)
#   PROD_EC2_HOST, PROD_EC2_SSH_KEY (main)
#
# Frontend NEXT_PUBLIC_* bake: CI copies /home/ubuntu/.env.production.frontend
# from EC2 via SSH (not git, not GitHub Secrets). See deploy/README.md.
#
name: Deploy

on:
  push:
    branches:
      - develop
      - main

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2.0.1

      - name: Fetch frontend bake env from EC2
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            HOST='${{ secrets.PROD_EC2_HOST }}'
            KEY='${{ secrets.PROD_EC2_SSH_KEY }}'
          else
            HOST='${{ secrets.DEV_EC2_HOST }}'
            KEY='${{ secrets.DEV_EC2_SSH_KEY }}'
          fi
          if [ -z "${HOST}" ] || [ -z "${KEY}" ]; then
            echo "::error::EC2 host/SSH key secret missing for branch ${{ github.ref_name }}"
            exit 1
          fi
          install -m 600 /dev/null /tmp/ec2.pem
          printf '%s\n' "$KEY" > /tmp/ec2.pem
          scp -i /tmp/ec2.pem -o StrictHostKeyChecking=accept-new \
            "ubuntu@${HOST}:/home/ubuntu/.env.production.frontend" \
            frontend/.env.production
          rm -f /tmp/ec2.pem
          grep -Eq '^NEXT_PUBLIC_CHAIN_11155111_RPC_URL=.+' frontend/.env.production
          grep -Eq '^NEXT_PUBLIC_CHAIN_11155111_RWA=.+' frontend/.env.production
          grep -Eq '^NEXT_PUBLIC_PRIVY_APP_ID=.+' frontend/.env.production
          echo "Fetched frontend bake env from ${HOST}"

      - name: Build & push frontend image
        run: |
          set -euo pipefail
          docker build \
            --build-arg API_PROXY_TARGET=http://backend:4000 \
            -t ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ github.ref_name }} \
            ./frontend
          docker push ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ github.ref_name }}

      - name: Build & push backend image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ github.ref_name }} \
            ./backend
          docker push ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ github.ref_name }}

  deploy-dev:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_name == 'develop'

    steps:
      - name: Deploy to Dev EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e

            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            APP_DIR="/home/ubuntu/app"
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone https://github.com/${{ github.repository }} "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin
            git checkout develop
            git pull origin develop

            bash backend/sql/scripts/apply-deploy-maintenance.sh

            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
            export IMAGE_TAG=develop

            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml pull
            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml up -d --force-recreate --remove-orphans
            docker image prune -f

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_name == 'main'

    steps:
      - name: Deploy to Prod EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -e

            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            APP_DIR="/home/ubuntu/app"
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone https://github.com/${{ github.repository }} "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin
            git checkout main
            git pull origin main

            bash backend/sql/scripts/apply-deploy-maintenance.sh

            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
            export IMAGE_TAG=main

            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml pull
            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml up -d --force-recreate --remove-orphans
            docker image prune -f
