# develop 푸시 → ECR 빌드 후 EC2에서 docker-compose pull
#
# Repository secrets (개발 서버 URL 예: http://54.116.29.201)
#   NEXT_PUBLIC_API_URL=http://54.116.29.201/api
#   NEXT_PUBLIC_ALCHEMY_RPC_URL=https://eth-sepolia.g.alchemy.com/v2/<KEY>
#   NEXT_PUBLIC_RWA_CONTRACT_ADDRESS (필수) — **Repository secrets** 에 넣어야 함 (Variables 만 있으면 빌드에 안 넘어감 → 아래에서 vars 폴백)
#   레거시 NEXT_PUBLIC_NFT_CONTRACT_ADDRESS (선택)
#   NEXT_PUBLIC_USDC/MARKETPLACE/PINATA_GATEWAY, NEXT_PUBLIC_SHOW_AUTH_LINKS(optional)
#   ECR_REGISTRY, AWS_*, DEV_EC2_*
#
name: Deploy

on:
  push:
    branches:
      - develop  # develop → 개발 서버 자동 배포
      - main     # main    → 프로덕션 서버 자동 배포 (추후 사용)

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── 1단계: 빌드 & ECR 푸시 ────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2.0.1

      # ── Frontend 빌드 ──────────────────────────────────────────
      - name: Build & push frontend image
        run: |
          set -euo pipefail
          # Secrets 우선; 없으면 Repository **Variables** (이름 동일) — Variables만 넣은 경우 대비
          RWA="${{ secrets.NEXT_PUBLIC_RWA_CONTRACT_ADDRESS }}"
          NFT="${{ secrets.NEXT_PUBLIC_NFT_CONTRACT_ADDRESS }}"
          USDC="${{ secrets.NEXT_PUBLIC_USDC_CONTRACT_ADDRESS }}"
          if [ -z "$RWA" ]; then RWA="${{ vars.NEXT_PUBLIC_RWA_CONTRACT_ADDRESS }}"; fi
          if [ -z "$NFT" ]; then NFT="${{ vars.NEXT_PUBLIC_NFT_CONTRACT_ADDRESS }}"; fi
          if [ -z "$USDC" ]; then USDC="${{ vars.NEXT_PUBLIC_USDC_CONTRACT_ADDRESS }}"; fi
          if [ -z "$RWA" ] && [ -z "$NFT" ]; then
            echo "::error::NEXT_PUBLIC_RWA_CONTRACT_ADDRESS (또는 레거시 NFT_) 가 비어 있습니다. Repository **Secrets** 또는 **Variables** 에 동일 이름으로 추가하세요."
            exit 1
          fi
          if [ -z "$USDC" ]; then
            echo "::error::NEXT_PUBLIC_USDC_CONTRACT_ADDRESS 가 비어 있습니다. Secrets 또는 Variables 에 추가하세요."
            exit 1
          fi
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_RWA_CONTRACT_ADDRESS="$RWA" \
            --build-arg NEXT_PUBLIC_NFT_CONTRACT_ADDRESS="$NFT" \
            --build-arg NEXT_PUBLIC_USDC_CONTRACT_ADDRESS="$USDC" \
            --build-arg NEXT_PUBLIC_MARKETPLACE_ADDRESS=${{ secrets.NEXT_PUBLIC_MARKETPLACE_ADDRESS }} \
            --build-arg NEXT_PUBLIC_PINATA_GATEWAY=${{ secrets.NEXT_PUBLIC_PINATA_GATEWAY }} \
            --build-arg NEXT_PUBLIC_ALCHEMY_RPC_URL=${{ secrets.NEXT_PUBLIC_ALCHEMY_RPC_URL }} \
            --build-arg NEXT_PUBLIC_SHOW_AUTH_LINKS=${{ secrets.NEXT_PUBLIC_SHOW_AUTH_LINKS }} \
            -t ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ github.ref_name }} \
            ./frontend
          docker push ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ github.ref_name }}

      # ── Backend 빌드 ───────────────────────────────────────────
      - name: Build & push backend image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ github.ref_name }} \
            ./backend
          docker push ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ github.ref_name }}

  # ── 2단계: 개발 서버 배포 (develop 브랜치) ─────────────────────
  deploy-dev:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_name == 'develop'

    steps:
      - name: Deploy to Dev EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e

            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # 레포가 없으면 클론, 있으면 최신화 (.git 존재 여부로 판단)
            APP_DIR="/home/ubuntu/app"
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone https://github.com/${{ github.repository }} "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin
            git checkout develop
            git pull origin develop

            # 시크릿은 docker-compose.ec2.yml → /home/ubuntu/.env.production.backend 만 사용 (~/app/backend 에 touch 불필요)
            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
            export IMAGE_TAG=develop

            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml pull
            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml up -d --force-recreate --remove-orphans
            docker image prune -f

  # ── 3단계: 프로덕션 배포 (main 브랜치) — 추후 사용 ──────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_name == 'main'

    steps:
      - name: Deploy to Prod EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -e

            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            APP_DIR="/home/ubuntu/app"
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone https://github.com/${{ github.repository }} "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin
            git checkout main
            git pull origin main

            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
            export IMAGE_TAG=main

            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml pull
            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml up -d --force-recreate --remove-orphans
            docker image prune -f
