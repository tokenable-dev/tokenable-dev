name: Deploy

on:
  push:
    branches:
      - develop  # develop → 개발 서버 자동 배포
      - main     # main    → 프로덕션 서버 자동 배포 (추후 사용)

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── 1단계: 빌드 & ECR 푸시 ────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ── Frontend 빌드 ──────────────────────────────────────────
      - name: Build & push frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_NFT_CONTRACT_ADDRESS=${{ secrets.NEXT_PUBLIC_NFT_CONTRACT_ADDRESS }} \
            --build-arg NEXT_PUBLIC_USDC_CONTRACT_ADDRESS=${{ secrets.NEXT_PUBLIC_USDC_CONTRACT_ADDRESS }} \
            --build-arg NEXT_PUBLIC_MARKETPLACE_ADDRESS=${{ secrets.NEXT_PUBLIC_MARKETPLACE_ADDRESS }} \
            --build-arg NEXT_PUBLIC_PINATA_GATEWAY=${{ secrets.NEXT_PUBLIC_PINATA_GATEWAY }} \
            -t ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ github.ref_name }} \
            ./frontend
          docker push ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ github.ref_name }}

      # ── Backend 빌드 ───────────────────────────────────────────
      - name: Build & push backend image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ github.ref_name }} \
            ./backend
          docker push ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ github.ref_name }}

  # ── 2단계: 개발 서버 배포 (develop 브랜치) ─────────────────────
  deploy-dev:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_name == 'develop'

    steps:
      - name: Deploy to Dev EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e

            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # 레포가 없으면 클론, 있으면 최신화 (.git 존재 여부로 판단)
            APP_DIR="/home/ubuntu/app"
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone https://github.com/${{ github.repository }} "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin
            git checkout develop
            git pull origin develop

            # .env.production 복원 (EC2에 /home/ubuntu/.env.production.backend 로 저장됨)
            cp /home/ubuntu/.env.production.backend ./backend/.env.production

            # 최신 이미지 받기 및 재시작
            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
            export IMAGE_TAG=develop

            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f

  # ── 3단계: 프로덕션 배포 (main 브랜치) — 추후 사용 ──────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_name == 'main'

    steps:
      - name: Deploy to Prod EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -e

            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            APP_DIR="/home/ubuntu/app"
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone https://github.com/${{ github.repository }} "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin
            git checkout main
            git pull origin main

            cp /home/ubuntu/.env.production.backend ./backend/.env.production

            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
            export IMAGE_TAG=main

            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f
