# develop 푸시 → ECR 빌드 후 EC2에서 docker-compose pull
#
# Required Repository secrets / variables (Secrets 우선, Variables 폴백)
#   Sepolia (11155111) — 필수
#     NEXT_PUBLIC_CHAIN_11155111_RPC_URL
#     NEXT_PUBLIC_CHAIN_11155111_RWA
#     NEXT_PUBLIC_CHAIN_11155111_USDC
#   NEXT_PUBLIC_PRIVY_APP_ID            (필수, Privy 로그인·지갑 — Dashboard App ID)
#   NEXT_PUBLIC_DEFAULT_CHAIN_ID        (선택, 기본 11155111 — Sepolia-only)
#   Ethereum mainnet (1) — 선택, 세 값 모두 있을 때만 UI에 노출
#     NEXT_PUBLIC_CHAIN_1_RPC_URL / _RWA / _USDC
#   NEXT_PUBLIC_PLATFORM_FEE_RECIPIENT  (선택, 빈 값이면 수수료 미적용)
#   NEXT_PUBLIC_PLATFORM_FEE_BPS        (선택, 기본 0)
#   NEXT_PUBLIC_GA_MEASUREMENT_ID      (선택, GA4 `G-XXXXXXXXXX` — 페이지뷰 추적)
#   NEXT_PUBLIC_API_URL - 비우면 브라우저는 same-origin /api (Nginx→Nest 권장)
#   CI에서 프론트 이미지 빌드 시 API_PROXY_TARGET=http://backend:4000 고정 (레포 deploy.yml)
#   ECR_REGISTRY, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   DEV_EC2_HOST, DEV_EC2_SSH_KEY (develop 배포)
#   PROD_EC2_HOST, PROD_EC2_SSH_KEY (main 배포)
#
name: Deploy

on:
  push:
    branches:
      - develop  # develop → 개발 서버 자동 배포
      - main     # main    → 프로덕션 서버 자동 배포 (추후 사용)

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── 1단계: 빌드 & ECR 푸시 ────────────────────────────────────
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2.0.1

      # ── Frontend 빌드 ──────────────────────────────────────────
      - name: Build & push frontend image
        run: |
          set -euo pipefail
          # Secrets 우선; 없으면 동일 이름의 Repository Variables 폴백
          CHAIN_11155111_RPC="${{ secrets.NEXT_PUBLIC_CHAIN_11155111_RPC_URL }}"
          CHAIN_11155111_RWA="${{ secrets.NEXT_PUBLIC_CHAIN_11155111_RWA }}"
          CHAIN_11155111_USDC="${{ secrets.NEXT_PUBLIC_CHAIN_11155111_USDC }}"
          if [ -z "$CHAIN_11155111_RPC" ];  then CHAIN_11155111_RPC="${{ vars.NEXT_PUBLIC_CHAIN_11155111_RPC_URL }}"; fi
          if [ -z "$CHAIN_11155111_RWA" ];  then CHAIN_11155111_RWA="${{ vars.NEXT_PUBLIC_CHAIN_11155111_RWA }}"; fi
          if [ -z "$CHAIN_11155111_USDC" ]; then CHAIN_11155111_USDC="${{ vars.NEXT_PUBLIC_CHAIN_11155111_USDC }}"; fi

          PRIVY="${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}"
          if [ -z "$PRIVY" ]; then PRIVY="${{ vars.NEXT_PUBLIC_PRIVY_APP_ID }}"; fi

          DEFAULT_CHAIN="${{ secrets.NEXT_PUBLIC_DEFAULT_CHAIN_ID }}"
          if [ -z "$DEFAULT_CHAIN" ]; then DEFAULT_CHAIN="${{ vars.NEXT_PUBLIC_DEFAULT_CHAIN_ID }}"; fi
          if [ -z "$DEFAULT_CHAIN" ]; then DEFAULT_CHAIN="11155111"; fi

          if [ -z "$CHAIN_11155111_RPC" ];  then echo "::error::NEXT_PUBLIC_CHAIN_11155111_RPC_URL 가 비어 있습니다."; exit 1; fi
          if [ -z "$CHAIN_11155111_RWA" ];  then echo "::error::NEXT_PUBLIC_CHAIN_11155111_RWA 가 비어 있습니다."; exit 1; fi
          if [ -z "$CHAIN_11155111_USDC" ]; then echo "::error::NEXT_PUBLIC_CHAIN_11155111_USDC 가 비어 있습니다."; exit 1; fi
          if [ -z "$PRIVY" ]; then echo "::error::NEXT_PUBLIC_PRIVY_APP_ID 가 비어 있습니다."; exit 1; fi

          CHAIN_1_RPC="${{ secrets.NEXT_PUBLIC_CHAIN_1_RPC_URL }}"
          CHAIN_1_RWA="${{ secrets.NEXT_PUBLIC_CHAIN_1_RWA }}"
          CHAIN_1_USDC="${{ secrets.NEXT_PUBLIC_CHAIN_1_USDC }}"
          if [ -z "$CHAIN_1_RPC" ];  then CHAIN_1_RPC="${{ vars.NEXT_PUBLIC_CHAIN_1_RPC_URL }}"; fi
          if [ -z "$CHAIN_1_RWA" ];  then CHAIN_1_RWA="${{ vars.NEXT_PUBLIC_CHAIN_1_RWA }}"; fi
          if [ -z "$CHAIN_1_USDC" ]; then CHAIN_1_USDC="${{ vars.NEXT_PUBLIC_CHAIN_1_USDC }}"; fi

          # Platform fee — 선택값 (없으면 빈값 그대로 build-arg 로 넘어가 런타임에 fee=0)
          FEE_RCPT="${{ secrets.NEXT_PUBLIC_PLATFORM_FEE_RECIPIENT }}"
          FEE_BPS="${{ secrets.NEXT_PUBLIC_PLATFORM_FEE_BPS }}"
          if [ -z "$FEE_RCPT" ]; then FEE_RCPT="${{ vars.NEXT_PUBLIC_PLATFORM_FEE_RECIPIENT }}"; fi
          if [ -z "$FEE_BPS" ];  then FEE_BPS="${{ vars.NEXT_PUBLIC_PLATFORM_FEE_BPS }}"; fi

          GA_ID="${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}"
          if [ -z "$GA_ID" ]; then GA_ID="${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}"; fi

          EXTRA_BUILD_ARGS=()
          API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
          if [ -n "$API_URL" ]; then
            EXTRA_BUILD_ARGS+=(--build-arg "NEXT_PUBLIC_API_URL=$API_URL")
          fi
          if [ -n "$GA_ID" ]; then
            EXTRA_BUILD_ARGS+=(--build-arg "NEXT_PUBLIC_GA_MEASUREMENT_ID=$GA_ID")
          fi

          CHAIN_1_BUILD_ARGS=()
          if [ -n "$CHAIN_1_RPC" ] && [ -n "$CHAIN_1_RWA" ] && [ -n "$CHAIN_1_USDC" ]; then
            CHAIN_1_BUILD_ARGS+=(
              --build-arg "NEXT_PUBLIC_CHAIN_1_RPC_URL=$CHAIN_1_RPC"
              --build-arg "NEXT_PUBLIC_CHAIN_1_RWA=$CHAIN_1_RWA"
              --build-arg "NEXT_PUBLIC_CHAIN_1_USDC=$CHAIN_1_USDC"
            )
          fi

          docker build \
            "${EXTRA_BUILD_ARGS[@]}" \
            --build-arg NEXT_PUBLIC_CHAIN_11155111_RPC_URL="$CHAIN_11155111_RPC" \
            --build-arg NEXT_PUBLIC_CHAIN_11155111_RWA="$CHAIN_11155111_RWA" \
            --build-arg NEXT_PUBLIC_CHAIN_11155111_USDC="$CHAIN_11155111_USDC" \
            --build-arg NEXT_PUBLIC_DEFAULT_CHAIN_ID="$DEFAULT_CHAIN" \
            --build-arg NEXT_PUBLIC_PRIVY_APP_ID="$PRIVY" \
            --build-arg NEXT_PUBLIC_PLATFORM_FEE_RECIPIENT="$FEE_RCPT" \
            --build-arg NEXT_PUBLIC_PLATFORM_FEE_BPS="$FEE_BPS" \
            "${CHAIN_1_BUILD_ARGS[@]}" \
            --build-arg API_PROXY_TARGET=http://backend:4000 \
            -t ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ github.ref_name }} \
            ./frontend
          docker push ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/tokenable-frontend:${{ github.ref_name }}

      # ── Backend 빌드 ───────────────────────────────────────────
      - name: Build & push backend image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ env.IMAGE_TAG }} \
            -t ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ github.ref_name }} \
            ./backend
          docker push ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/tokenable-backend:${{ github.ref_name }}

  # ── 2단계: 개발 서버 배포 (develop 브랜치) ─────────────────────
  deploy-dev:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_name == 'develop'

    steps:
      - name: Deploy to Dev EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.DEV_EC2_SSH_KEY }}
          script: |
            set -e

            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # 레포가 없으면 클론, 있으면 최신화 (.git 존재 여부로 판단)
            APP_DIR="/home/ubuntu/app"
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone https://github.com/${{ github.repository }} "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin
            git checkout develop
            git pull origin develop

            # 시크릿은 docker-compose.ec2.yml → /home/ubuntu/.env.production.backend 만 사용 (~/app/backend 에 touch 불필요)
            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
            export IMAGE_TAG=develop

            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml pull
            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml up -d --force-recreate --remove-orphans
            docker image prune -f

  # ── 3단계: 프로덕션 배포 (main 브랜치) — 추후 사용 ──────────────
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref_name == 'main'

    steps:
      - name: Deploy to Prod EC2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_EC2_HOST }}
          username: ubuntu
          key:      ${{ secrets.PROD_EC2_SSH_KEY }}
          script: |
            set -e

            aws ecr get-login-password --region ap-northeast-2 \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            APP_DIR="/home/ubuntu/app"
            if [ ! -d "$APP_DIR/.git" ]; then
              rm -rf "$APP_DIR"
              git clone https://github.com/${{ github.repository }} "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin
            git checkout main
            git pull origin main

            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}
            export IMAGE_TAG=main

            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml pull
            docker-compose -f docker-compose.yml -f docker-compose.ec2.yml up -d --force-recreate --remove-orphans
            docker image prune -f
