<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokenable — Sell</title>
<script src="support.js"></script>
</head>
<body>
<x-dc data-theme="dark">
<helmet>
<script src="ds-base.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0e0e0e;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .dot{width:9px;height:9px;border-radius:50%;background:#1A6FFF;animation:pulse 0.9s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:0.3;transform:scale(0.8);}50%{opacity:1;transform:scale(1);}}
</style>
</helmet>
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
    <div style="display:flex;gap:8px;"><span class="dot"></span><span class="dot" style="animation-delay:0.15s;"></span><span class="dot" style="animation-delay:0.3s;"></span></div>
    <div style="font-size:14px;color:rgba(255,255,255,0.5);">Opening your seller tools…</div>
  </div>
<script>
setTimeout(function(){
  var role='user', partnerOk=false;
  try{ role=localStorage.getItem('tk_role')||'user'; partnerOk=(localStorage.getItem('tk_partner_status')==='approved'); }catch(e){}
  var dest = (role==='partner' && partnerOk) ? 'Partner-Add-Cards.html' : 'Vault-Dashboard-Active.html';
  window.location.replace(dest);
}, 250);
</script>
</x-dc>
</body>
</html>
