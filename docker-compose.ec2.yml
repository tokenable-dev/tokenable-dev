# EC2 전용 — 레포의 backend/.env.production 에 쓰지 않고 홈의 시크릿 파일 사용
# ~/.env.production.backend: DATABASE_*, JWT_*, CORS_ORIGIN (comma list: IP + https domain),
#   FRONTEND_URL, GOOGLE_CALLBACK_URL, GOOGLE_CLIENT_ID/SECRET, COOKIE_SECURE, etc.
# 사용법:
#   docker compose -f docker-compose.yml -f docker-compose.ec2.yml up -d
services:
  backend:
    env_file:
      - /home/ubuntu/.env.production.backend
