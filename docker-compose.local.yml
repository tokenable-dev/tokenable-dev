# 로컬 개발용 — 소스 코드에서 직접 빌드
# 사용법: docker compose -f docker-compose.local.yml up --build

services:
  nginx:
    image: nginx:alpine
    container_name: tokenable-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - tokenable-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
        NEXT_PUBLIC_NFT_CONTRACT_ADDRESS: ${NEXT_PUBLIC_NFT_CONTRACT_ADDRESS}
        NEXT_PUBLIC_USDC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_USDC_CONTRACT_ADDRESS}
        NEXT_PUBLIC_MARKETPLACE_ADDRESS: ${NEXT_PUBLIC_MARKETPLACE_ADDRESS}
        NEXT_PUBLIC_PINATA_GATEWAY: ${NEXT_PUBLIC_PINATA_GATEWAY}
    container_name: tokenable-frontend
    expose:
      - "3000"
    networks:
      - tokenable-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tokenable-backend
    env_file:
      - ./backend/.env
    expose:
      - "4000"
    networks:
      - tokenable-net

networks:
  tokenable-net:
    driver: bridge
