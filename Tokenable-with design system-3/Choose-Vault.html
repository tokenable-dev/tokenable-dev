<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokenable — Choose a vault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0e0e0e; --surf:#191919;
    --azure:#1A6FFF; --brand-400:#5B9AFF; --pos:#00C864; --warn:#EA8200;
    --t1:rgba(255,255,255,0.95); --t2:rgba(255,255,255,0.55); --t3:rgba(255,255,255,0.35);
    --font-sans:'Inter',sans-serif; --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:#fff;font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
  a{color:var(--azure);text-decoration:none;}
  .mono{font-family:var(--font-mono);}

  header{position:sticky;top:0;z-index:50;background:var(--ink);border-bottom:1px solid rgba(255,255,255,0.08);}
  .gnb{display:flex;align-items:center;height:64px;padding:0 clamp(16px,4vw,40px);}
  .wordmark{font-weight:800;font-size:17px;letter-spacing:0.14em;color:#fff;}
  .navlink{font-size:14.5px;font-weight:500;color:var(--t2);height:64px;display:inline-flex;align-items:center;position:relative;}
  .navlink.on{color:#fff;font-weight:600;}
  .navlink.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--azure);}
  .pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:0.06em;padding:5px 10px;border-radius:6px;}

  .eyebrow{font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--azure);}
  .page-h1{margin:12px 0 0;font-weight:700;font-size:clamp(26px,3.6vw,38px);letter-spacing:-0.025em;line-height:1.1;}
  .page-sub{margin:10px 0 0;font-size:15px;color:var(--t2);line-height:1.55;max-width:620px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;font-family:var(--font-sans);font-weight:600;transition:all 0.12s;
    clip-path:polygon(0 6px,4px 2px,8px 0,calc(100% - 8px) 0,calc(100% - 4px) 2px,100% 6px,100% calc(100% - 6px),calc(100% - 4px) calc(100% - 2px),calc(100% - 8px) 100%,8px 100%,4px calc(100% - 2px),0 calc(100% - 6px));}
  .btn--primary{background:var(--azure);color:#fff;box-shadow:inset 0 0 0 3px rgba(0,0,20,0.5),inset 0 0 0 1px rgba(80,160,255,0.6),inset 0 3px 0 0 rgba(80,170,255,0.7),inset 0 -3px 0 0 rgba(0,0,50,0.4);filter:drop-shadow(4px 4px 0 rgba(26,111,255,0.55));}
  .btn--primary:hover:not([disabled]){filter:drop-shadow(5px 5px 0 rgba(26,111,255,0.65));transform:translate(-1px,-1px);}
  .btn--subtle{background:var(--surf);color:#fff;box-shadow:inset 0 0 0 3px rgba(0,0,20,0.5),inset 0 0 0 1px rgba(255,255,255,0.1),inset 0 3px 0 0 rgba(255,255,255,0.15),inset 0 -3px 0 0 rgba(0,0,0,0.3);filter:drop-shadow(4px 4px 0 rgba(5,10,30,0.7));}
  .btn--subtle:hover{filter:drop-shadow(5px 5px 0 rgba(5,10,30,0.8));transform:translate(-1px,-1px);}
  .btn[disabled]{opacity:0.4;cursor:not-allowed;filter:none;transform:none;}

  .opt{position:relative;display:flex;flex-direction:column;gap:14px;padding:26px;background:var(--surf);border-radius:16px;cursor:pointer;text-align:left;border:0;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.06);transition:all 0.12s;width:100%;font-family:var(--font-sans);}
  .opt:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,0.16);transform:translateY(-2px);}
  .opt.sel{box-shadow:inset 0 0 0 2px var(--azure);background:rgba(26,111,255,0.05);}
  .opt__ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .opt__t{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
  .opt__d{font-size:13.5px;color:var(--t2);line-height:1.6;}
  .feat{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--t2);line-height:1.5;}
  .feat svg{flex-shrink:0;margin-top:2px;}
  .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:36px;}
  @media(max-width:820px){ .nav-links{display:none;} .opt-grid{grid-template-columns:1fr;} }
</style>
</head>
<body>

<template id="__bundler_thumbnail" data-bg-color="#0e0e0e">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0e0e0e"/>
    <rect x="360" y="250" width="200" height="200" rx="26" fill="#191919"/>
    <rect x="640" y="250" width="200" height="200" rx="26" fill="#191919"/>
    <rect x="392" y="292" width="60" height="60" rx="14" fill="rgba(0,200,100,0.18)"/>
    <rect x="672" y="292" width="60" height="60" rx="14" fill="rgba(26,111,255,0.2)"/>
    <rect x="392" y="378" width="128" height="14" rx="7" fill="rgba(255,255,255,0.5)"/>
    <rect x="672" y="378" width="128" height="14" rx="7" fill="rgba(255,255,255,0.5)"/>
    <rect x="392" y="406" width="90" height="10" rx="5" fill="rgba(255,255,255,0.22)"/>
    <rect x="672" y="406" width="90" height="10" rx="5" fill="rgba(255,255,255,0.22)"/>
    <rect x="440" y="516" width="320" height="46" rx="8" fill="#1A6FFF"/>
    <rect x="470" y="150" width="260" height="20" rx="10" fill="rgba(255,255,255,0.75)"/>
  </svg>
</template>

  <header>
    <div class="gnb">
      <span class="wordmark">TOKENABLE</span>
      <nav class="nav-links" style="display:flex;gap:40px;margin-left:52px;">
        <a class="navlink" href="#">Markets</a>
        <a class="navlink" href="#">Portfolio</a>
        <a class="navlink on" href="#">Sell</a>
      </nav>
      <div style="flex:1;"></div>
      <span class="pill" style="background:rgba(26,111,255,0.14);color:var(--brand-400);">PARTNER ACCOUNT</span>
    </div>
  </header>

  <section style="padding:56px clamp(16px,4vw,40px) 100px;">
    <div style="max-width:900px;margin:0 auto;">
      <div class="eyebrow">Choose a vault</div>
      <h1 class="page-h1">How do you want to list these cards?</h1>
      <p class="page-sub">List straight from your own vault, or send the cards to PSA to be verified first.</p>

      <div class="opt-grid">
        <button class="opt" data-vault="self">
          <div style="display:flex;align-items:center;gap:14px;">
            <span class="opt__ic" style="background:rgba(0,200,100,0.12);color:var(--pos);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M7 4v16M17 4v16"/></svg></span>
            <span class="pill" style="background:rgba(0,200,100,0.12);color:var(--pos);">INSTANT</span>
          </div>
          <div><div class="opt__t">Self vault</div><div class="opt__d" style="margin-top:5px;">Cards you already hold. List them right away &mdash; no shipping, no review.</div></div>
          <div style="display:flex;flex-direction:column;gap:9px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.07);">
            <span class="feat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--pos)" stroke-width="2.6"><polyline points="20 6 9 17 4 12"/></svg>Listed within minutes</span>
            <span class="feat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--pos)" stroke-width="2.6"><polyline points="20 6 9 17 4 12"/></svg>Stays in your own vault</span>
            <span class="feat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12" y2="16.5"/></svg>You attest to authenticity and condition</span>
          </div>
        </button>

        <button class="opt" data-vault="psa">
          <div style="display:flex;align-items:center;gap:14px;">
            <span class="opt__ic" style="background:rgba(26,111,255,0.12);color:var(--brand-400);"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg></span>
            <span class="pill" style="background:rgba(255,255,255,0.06);color:var(--t2);">0&ndash;15 BUSINESS DAYS AFTER ARRIVAL</span>
          </div>
          <div><div class="opt__t">PSA vault</div><div class="opt__d" style="margin-top:5px;">Send them to PSA. Once verified, your listing goes live.</div></div>
          <div style="display:flex;flex-direction:column;gap:9px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.07);">
            <span class="feat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--pos)" stroke-width="2.6"><polyline points="20 6 9 17 4 12"/></svg>Verified by PSA before it goes live</span>
            <span class="feat"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12" y2="16.5"/></svg>Requires shipping and intake review</span>
          </div>
        </button>
      </div>

      <div style="display:flex;gap:14px;margin-top:32px;">
        <button class="btn btn--subtle" style="height:52px;padding:0 24px;font-size:15px;">Back</button>
        <button class="btn btn--primary" id="continue-btn" disabled style="height:52px;flex:1;max-width:320px;font-size:15px;">Continue</button>
      </div>
      <div id="hint" style="font-size:12.5px;color:var(--t3);margin-top:10px;line-height:1.5;">Pick a vault to continue.</div>
    </div>
  </section>

<script>
(function(){
  var pick=null;
  var btn=document.getElementById('continue-btn');
  var hint=document.getElementById('hint');
  document.addEventListener('click', function(e){
    var opt=e.target.closest && e.target.closest('.opt');
    if(!opt) return;
    pick=opt.getAttribute('data-vault');
    document.querySelectorAll('.opt').forEach(function(x){ x.classList.toggle('sel', x===opt); });
    btn.disabled=false;
    btn.textContent = pick==='self' ? 'Continue with self vault' : 'Continue with PSA vault';
    hint.innerHTML = pick==='self'
      ? 'Your cards stay in your vault and can be listed right away.'
      : 'You&rsquo;ll ship these cards to PSA to be verified before they go live.';
  });
})();
</script>
</body>
</html>
