packages:
  - "."

# pnpm 11+ — 네이티브 optional deps 빌드 허용 (v10의 onlyBuiltDependencies 대체)
allowBuilds:
  sharp: true
  bufferutil: true
  utf-8-validate: true
  unrs-resolver: false
  # postinstall is a version check / funding banner, not a build
  "@reown/appkit": false
  core-js: false
  # native hash; script is `node-gyp-build || exit 0`, JS fallback if no prebuild
  keccak: true
