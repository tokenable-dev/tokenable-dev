services:
  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tokenable-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tokenable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokenable}
      POSTGRES_DB: ${POSTGRES_DB:-tokenable}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 첫 기동 시에만 실행됨(기존 볼륨이면 스킵). 이미 띄운 EC2 DB에는 003 마이그레이션을 수동 적용.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # 호스트에서 Nest/로컬 클라이언트가 localhost:5432 로 붙을 수 있게 함 (expose 만으로는 호스트에 안 열림)
    ports:
      - "5432:5432"
    expose:
      - "5432"
    restart: always
    networks:
      - tokenable-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tokenable}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx (리버스 프록시) ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tokenable-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Default: HTTP + ACME. On EC2 after certs: set NGINX_CONF=./nginx/nginx.tls.conf in .env (no cp).
      - ${NGINX_CONF:-./nginx/nginx.conf}:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - tokenable-net

  # ── Frontend (Next.js) ─────────────────────────────────────────────
  frontend:
    image: ${ECR_REGISTRY}/tokenable-frontend:${IMAGE_TAG:-latest}
    container_name: tokenable-frontend
    environment:
      - NODE_ENV=production
      - PORT=3000
      # SSR 등 서버에서 백엔드 호출 시 (브라우저는 동일 호스트 /api 사용)
      - INTERNAL_API_URL=http://backend:4000/api
    expose:
      - "3000"
    restart: always
    networks:
      - tokenable-net

  # ── Backend (NestJS) ───────────────────────────────────────────────
  # env_file 은 합쳐지므로 베이스에 두지 않음 → 로컬: docker-compose.local.yml / EC2: docker-compose.ec2.yml
  backend:
    image: ${ECR_REGISTRY}/tokenable-backend:${IMAGE_TAG:-latest}
    container_name: tokenable-backend
    expose:
      - "4000"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tokenable-net

volumes:
  postgres_data:

networks:
  tokenable-net:
    driver: bridge
