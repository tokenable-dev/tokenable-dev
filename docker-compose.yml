services:
  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tokenable-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tokenable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokenable}
      POSTGRES_DB: ${POSTGRES_DB:-tokenable}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: always
    networks:
      - tokenable-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tokenable}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx (리버스 프록시) ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: tokenable-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
    networks:
      - tokenable-net

  # ── Frontend (Next.js) ─────────────────────────────────────────────
  frontend:
    image: ${ECR_REGISTRY}/tokenable-frontend:${IMAGE_TAG:-latest}
    container_name: tokenable-frontend
    environment:
      - NODE_ENV=production
      - PORT=3000
      # SSR 등 서버에서 백엔드 호출 시 (브라우저는 동일 호스트 /api 사용)
      - INTERNAL_API_URL=http://backend:4000/api
    expose:
      - "3000"
    restart: always
    networks:
      - tokenable-net

  # ── Backend (NestJS) ───────────────────────────────────────────────
  # 로컬: ./backend/.env.production
  # EC2: docker compose -f docker-compose.yml -f docker-compose.ec2.yml ... (시크릿 경로 오버라이드)
  backend:
    image: ${ECR_REGISTRY}/tokenable-backend:${IMAGE_TAG:-latest}
    container_name: tokenable-backend
    env_file:
      - ./backend/.env.production
    expose:
      - "4000"
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tokenable-net

volumes:
  postgres_data:

networks:
  tokenable-net:
    driver: bridge
