events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 로그 포맷
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # 업로드 파일 크기 제한 (RWA 이미지 업로드 고려)
    client_max_body_size 50M;

    # gzip 압축
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── 트래픽 스파이크 방어 ─────────────────────────────────────────
    # per-IP 요청 속도 + 동시 연결 제한. Nest @nestjs/throttler 가 2차 방어선.
    limit_req_zone  $binary_remote_addr zone=api_perip:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=auth_perip:10m  rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # 업스트림이 밀릴 때 nginx 워커가 무한정 물려 있지 않도록 타임아웃 고정
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # Git tracks this file as HTTP-only (port 80 + ACME). Do not add listen 443 here.
    # After certbot on EC2: in ~/app/.env set NGINX_CONF=./nginx/nginx.tls.conf then recreate nginx (no overwrite of this file).
    server {
        listen 80 default_server;
        server_name _;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://backend:4000;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # 로그인·게이트 검증 — 무차별 대입/스탬피드 차단 (초당 2회 + burst 5)
        location ~ ^/api/(auth/privy/session|site-access/verify)$ {
            limit_req  zone=auth_perip burst=5 nodelay;
            limit_conn conn_perip 10;
            proxy_pass         $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # /api/* -> NestJS backend (:4000)
        # OAuth redirect URI must match the URL users open, e.g.
        # https://tokenable-dev.com/api/auth/google/callback and http://<public-ip>/api/auth/google/callback
        location /api/ {
            limit_req  zone=api_perip burst=40 nodelay;
            limit_conn conn_perip 20;
            proxy_pass         $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # /* → 프론트엔드 (Next.js :3000)
        location / {
            limit_conn conn_perip 30;
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
