events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── 트래픽 스파이크 방어 ─────────────────────────────────────────
    # per-IP 요청 속도 + 동시 연결 제한. Nest @nestjs/throttler 가 2차 방어선.
    limit_req_zone  $binary_remote_addr zone=api_perip:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=auth_perip:10m  rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_perip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # 업스트림이 밀릴 때 nginx 워커가 무한정 물려 있지 않도록 타임아웃 고정
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # ── 도메인: HTTP → HTTPS (ACME 예외) ─────────────────────────────
    server {
        listen 80;
        server_name tokenable-dev.com www.tokenable-dev.com;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── 공인 IP 등: HTTP 프록시 유지 (인증서 없음) ─────────────────────
    server {
        listen 80 default_server;
        server_name _;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://backend:4000;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location ~ ^/api/(auth/privy/session|site-access/verify)$ {
            limit_req  zone=auth_perip burst=5 nodelay;
            limit_conn conn_perip 10;
            proxy_pass         $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req  zone=api_perip burst=40 nodelay;
            limit_conn conn_perip 20;
            proxy_pass         $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            limit_conn conn_perip 30;
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # ── 도메인: HTTPS ────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name tokenable-dev.com www.tokenable-dev.com;

        ssl_certificate     /etc/letsencrypt/live/tokenable-dev.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tokenable-dev.com/privkey.pem;

        client_max_body_size 50M;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_api http://backend:4000;

        location ~ ^/api/(auth/privy/session|site-access/verify)$ {
            limit_req  zone=auth_perip burst=5 nodelay;
            limit_conn conn_perip 10;
            proxy_pass         $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req  zone=api_perip burst=40 nodelay;
            limit_conn conn_perip 20;
            proxy_pass         $upstream_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location / {
            limit_conn conn_perip 30;
            proxy_pass         http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection 'upgrade';
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
