<style>
  :root:root{ --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  :root{
    --ink: #0e0e0e; --ink-2: #0e0e0e;
    --surf: #141414; --surf-2: #111111;
    --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.05);
    --azure: rgb(26,111,255); --pos: rgb(0,200,100); --neg: rgb(228,55,74);
    --amber: #F59E0B; --purple: #8B5CF6;
    --t2: rgba(255,255,255,0.55); --t3: rgba(255,255,255,0.35);
    --brand-500: #1A6FFF; --brand-400: #5B9AFF; --brand-900: #191919;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:#fff;font-family:var(--font-sans, 'Inter', sans-serif);-webkit-font-smoothing:antialiased;}
  .mono{font-family:var(--font-mono);}

  /* GNB */
  header{position:sticky;top:0;z-index:50;background:var(--ink-2);border-bottom:1px solid rgba(255,255,255,0.08);}
  .navlink{font-family:var(--font-sans);font-size:14.5px;font-weight:500;color:var(--t2);text-decoration:none;height:64px;display:inline-flex;align-items:center;position:relative;transition:color 0.15s;cursor:pointer;}
  .navlink:hover{color:#fff;}
  .navlink.on{color:#fff;font-weight:600;}
  .navlink.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--azure);}
  .gnb-burger{display:none;background:none;border:0;color:#fff;cursor:pointer;padding:4px;}
  .gnb-logo-full{height:22px;}
  .gnb-logo-symbol{height:28px;display:none;}
  .gnb-right{display:flex;align-items:center;gap:14px;}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;font-family:var(--font-sans);font-weight:600;transition:all 0.12s;border-radius:0;clip-path:polygon(0 6px,4px 2px,8px 0,calc(100% - 8px) 0,calc(100% - 4px) 2px,100% 6px,100% calc(100% - 6px),calc(100% - 4px) calc(100% - 2px),calc(100% - 8px) 100%,8px 100%,4px calc(100% - 2px),0 calc(100% - 6px));}
  .btn--primary{background:#1A6FFF;color:#fff;box-shadow:inset 0 0 0 3px rgba(0,0,20,0.5),inset 0 0 0 1px rgba(80,160,255,0.6),inset 0 3px 0 0 rgba(80,170,255,0.7),inset 0 -3px 0 0 rgba(0,0,50,0.4);filter:drop-shadow(4px 4px 0 rgba(26,111,255,0.55));}
  .btn--primary:hover{filter:drop-shadow(5px 5px 0 rgba(26,111,255,0.65));transform:translate(-1px,-1px);}
  .btn--ghost{background:#191919;color:#fff;box-shadow:inset 0 0 0 3px rgba(0,0,20,0.5),inset 0 0 0 1px rgba(255,255,255,0.1),inset 0 3px 0 0 rgba(255,255,255,0.15),inset 0 -3px 0 0 rgba(0,0,0,0.3);filter:drop-shadow(4px 4px 0 rgba(5,10,30,0.7));}
  .btn--ghost:hover{filter:drop-shadow(5px 5px 0 rgba(5,10,30,0.8));transform:translate(-1px,-1px);}
  .btn--disabled{opacity:0.4;cursor:not-allowed;pointer-events:none;}

  /* Card box */
  .card-box{background:#191919;border-radius:16px;padding:24px;}

  /* Badges */
  .badge{font-family:var(--font-mono);font-size:11px;font-weight:600;padding:3px 10px;border-radius:6px;display:inline-flex;align-items:center;gap:4px;}
  .badge--user{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);}
  .badge--system{background:rgba(26,111,255,0.12);color:var(--azure);}
  .badge--webhook{background:rgba(139,92,246,0.12);color:var(--purple);}
  .badge--blockchain{background:rgba(0,200,100,0.12);color:var(--pos);}
  .badge--admin{background:rgba(245,158,11,0.12);color:var(--amber);}

  /* Timeline */
  .tl-step{display:flex;gap:16px;position:relative;padding-bottom:0;}
  .tl-step:last-child{padding-bottom:0;}
  .tl-rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:14px;}
  .tl-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;position:relative;z-index:1;}
  .tl-dot--done{background:var(--pos);}
  .tl-dot--active{background:var(--azure);box-shadow:0 0 12px rgba(26,111,255,0.6);animation:pulse-dot 2s infinite;}
  .tl-dot--pending{background:#374151;}
  .tl-line{width:2px;flex:1;}
  .tl-line--done{background:var(--pos);}
  .tl-line--active{background:linear-gradient(180deg,var(--azure),#374151);}
  .tl-line--pending{background:#374151;opacity:0.3;}
  .tl-body{flex:1;min-width:0;padding-top:0;}
  .tl-title{font-size:15px;font-weight:700;color:#fff;margin-bottom:2px;}
  .tl-step.pending .tl-title{color:rgba(255,255,255,0.35);}
  .tl-step.pending .tl-desc{color:rgba(255,255,255,0.2);}
  .tl-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
  .tl-time{font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,0.3);}
  .tl-desc{font-size:13px;color:rgba(255,255,255,0.45);line-height:1.6;}

  /* Spinner */
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(26,111,255,0.2);border-top-color:var(--azure);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes pulse-dot{0%,100%{box-shadow:0 0 6px rgba(26,111,255,0.4);}50%{box-shadow:0 0 18px rgba(26,111,255,0.8);}}

  /* Step pills */
  .step-pills{display:flex;gap:0;align-items:center;margin-top:20px;}
  .step-pill{flex:1;height:4px;transition:background 0.2s;}
  .step-pill:first-child{border-radius:3px 0 0 3px;}
  .step-pill:last-child{border-radius:0 3px 3px 0;}
  .step-pill.done{background:var(--pos);}
  .step-pill.active{background:var(--azure);animation:pulse-pill 2s infinite;}
  .step-pill.pending{background:rgba(255,255,255,0.06);}
  @keyframes pulse-pill{0%,100%{opacity:0.7;}50%{opacity:1;}}
  .step-pills-labels{display:flex;gap:0;margin-top:14px;}
  .step-pills-labels .sl{flex:1;font-size:12px;font-weight:500;color:rgba(255,255,255,0.3);}
  .step-pills-labels .sl:first-child{text-align:left;}
  .step-pills-labels .sl:last-child{text-align:right;}
  .step-pills-labels .sl.done{color:var(--pos);font-weight:600;}
  .step-pills-labels .sl.active{color:var(--azure);font-weight:700;}
  .step-pills-labels .sl-sub{font-size:11px;font-weight:400;margin-top:2px;}

  /* Step indicator (Vault flow) */
  .circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:14px;font-weight:700;flex-shrink:0;}
  .circle svg{display:block;}
  .circle--done{background:var(--pos);color:#fff;}
  .circle--active{background:var(--azure);color:#fff;box-shadow:0 0 16px rgba(26,111,255,0.35);}
  .step-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:36px;text-align:center;position:relative;}
  .step-col-labels{position:absolute;top:44px;left:50%;transform:translateX(-50%);white-space:nowrap;}
  .step-flow-label{font-size:12px;font-weight:600;}
  .step-flow-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:0.03em;text-transform:uppercase;margin-top:4px;}
  .step-connector{flex:1;height:2px;margin-top:17px;}
  .step-spinner{display:inline-block;width:11px;height:11px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;}

  /* Live log */
  .log-wrap{background:#0e0e18;border-radius:12px;padding:16px;max-height:240px;overflow-y:auto;font-family:var(--font-mono);font-size:12px;line-height:2;}
  .log-wrap::-webkit-scrollbar{width:4px;}
  .log-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}
  .log-line{display:flex;gap:10px;align-items:baseline;}
  .log-time{color:rgba(255,255,255,0.25);flex-shrink:0;width:42px;}
  .log-actor{flex-shrink:0;width:80px;}
  .log-msg{color:rgba(255,255,255,0.5);}

  /* Detail row */
  .detail-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
  .detail-row:last-child{border-bottom:none;}
  .detail-k{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.35);}
  .detail-v{font-size:13px;font-weight:600;color:#fff;text-align:right;}

  /* 2-col layout */
  .page-grid{display:grid;grid-template-columns:1fr 380px;gap:40px;max-width:1200px;margin:0 auto;padding:40px clamp(16px,4vw,40px) 80px;}
  .page-grid.multi-mode{grid-template-columns:1fr;max-width:1400px;}

  /* Search */
  .tk-search .tk-input{background:rgba(255,255,255,0.85)!important;color:#111!important;border:none!important;box-shadow:none!important;}
  .tk-search .tk-input::placeholder{color:rgba(0,0,0,0.4)!important;}
  .tk-search__icon{display:flex!important;color:rgba(0,0,0,0.4)!important;}
  .tk-search{clip-path:var(--pixel-notch-md);overflow:hidden;}
  .tk-search .tk-input{clip-path:none!important;height:36px!important;font-size:14px!important;}

  /* Notification banner */
  .notif-banner{background:rgba(26,111,255,0.06);border:1px solid rgba(26,111,255,0.15);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:12px;font-size:13px;color:rgba(255,255,255,0.55);}

  /* Large multi-card state */
  .stat-pill{background:#191919;border-radius:12px;padding:14px 16px;cursor:pointer;border:1.5px solid transparent;transition:all 0.15s;}
  .stat-pill:hover{border-color:rgba(255,255,255,0.12);}
  .stat-pill.active{border-color:var(--azure);background:rgba(26,111,255,0.1);}
  .stat-pill .n{font-family:var(--font-mono);font-size:22px;font-weight:700;color:#fff;}
  .stat-pill .l{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;}
  .filter-tab{font-family:var(--font-mono);font-size:11.5px;font-weight:600;padding:7px 14px;border-radius:20px;background:#191919;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.08);cursor:pointer;}
  .filter-tab.active{background:var(--azure);color:#fff;border-color:var(--azure);}
  #lm-list::-webkit-scrollbar{width:6px;}
  #lm-list::-webkit-scrollbar-thumb{background:var(--azure);border-radius:3px;}
  .lm-row{display:flex;gap:14px;align-items:flex-start;padding:12px;background:#191919;border-radius:10px;flex-shrink:0;cursor:pointer;transition:background 0.15s;}
  .lm-row:hover{background:#1f1f1f;}
  .lm-row.minted{box-shadow:inset 3px 0 0 0 var(--pos);}
  .lm-row.minting{box-shadow:inset 3px 0 0 0 var(--azure);animation:pulse-pill 2s infinite;}
  .lm-row.rejected{box-shadow:inset 3px 0 0 0 var(--neg);}
  .lm-row.reviewing{box-shadow:inset 3px 0 0 0 var(--azure);}
  .lm-row.approved{box-shadow:inset 3px 0 0 0 var(--pos);}
  .lm-row.completed{box-shadow:inset 3px 0 0 0 var(--pos);}
  .lm-row.failed{box-shadow:inset 3px 0 0 0 var(--neg);}
  .lm-row.selected{background:rgba(0,51,255,0.12);box-shadow:inset 3px 0 0 0 var(--azure);}
  .sd-switcher{position:fixed;bottom:24px;right:24px;z-index:100;display:flex;flex-wrap:wrap;gap:4px;max-width:340px;justify-content:flex-end;background:#191919;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:8px;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
  .sd-switcher button{border:0;background:transparent;color:rgba(255,255,255,0.45);font-family:var(--font-mono);font-size:10.5px;font-weight:600;padding:6px 9px;cursor:pointer;letter-spacing:0.02em;border-radius:6px;white-space:nowrap;}
  .sd-switcher button:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .sd-switcher button.on{background:var(--azure);color:#fff;}
  .lm-list-scroll.card-list{height:480px;overflow-y:auto;border:1px solid rgba(255,255,255,0.08);border-radius:12px;background:#141414;padding:10px;display:flex;flex-direction:column;gap:8px;}

  /* Layout B: master-detail flex */
  .submission-layout{display:flex;flex-direction:row;gap:24px;align-items:flex-start;min-height:100vh;}
  .left-col{flex:0 0 55%;max-width:55%;}
  .right-panel{flex:0 0 45%;max-width:45%;position:sticky;top:80px;height:calc(100vh - 100px);overflow-y:auto;background:rgba(255,255,255,0.03);border-left:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:24px;display:flex;align-items:center;justify-content:center;}
  .right-panel.selected{align-items:flex-start;justify-content:flex-start;}
  .lb-panel-inner{transition:opacity 0.15s ease;width:100%;}

  /* Mobile bottom sheet */
  .lb-sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:150;}
  .lb-sheet-overlay.open{display:block;}
  .lb-sheet{position:fixed;left:0;right:0;bottom:0;height:70vh;background:#141414;border-radius:20px 20px 0 0;z-index:151;transform:translateY(100%);transition:transform 0.25s ease;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,0.5);}
  .lb-sheet.open{transform:translateY(0);}
  .lb-sheet-handle{width:40px;height:4px;background:rgba(255,255,255,0.25);border-radius:2px;margin:12px auto 8px;flex-shrink:0;touch-action:none;}

  @media(max-width:1024px){
    .submission-layout{flex-direction:column;}
    .left-col{flex:1 1 auto;max-width:100%;}
    .right-panel{display:none;}
  }
  @media(max-width:640px){
    #lm-pills{grid-template-columns:repeat(2,1fr)!important;}
    #lm-tabs{overflow-x:auto;flex-wrap:nowrap!important;}
    .card-list{height:auto;max-height:none;}
  }

  /* Mobile */
  @media(max-width:1024px){
    .page-grid{grid-template-columns:1fr;gap:32px;}
    .gnb-burger{display:block;}
    .gnb-logo-full{display:none;}
    .gnb-logo-symbol{display:block;}
    header nav{display:none;}
  }

  /* Mobile nav */
  .gnb-burger{display:none;width:42px;height:42px;border:0;background:transparent;color:#fff;cursor:pointer;align-items:center;justify-content:center;position:relative;}
  .burger-lines{display:flex;flex-direction:column;gap:6px;width:20px;}
  .burger-lines span{display:block;height:2px;background:#fff;border-radius:1px;transition:transform 0.25s ease, opacity 0.25s ease;}
  .gnb-burger.is-open .burger-lines span:first-child{transform:translateY(4px) rotate(45deg);}
  .gnb-burger.is-open .burger-lines span:last-child{transform:translateY(-4px) rotate(-45deg);}
  .gnb-drawer{display:none;position:fixed;inset:64px 0 0 0;z-index:45;background:var(--ink-2);flex-direction:column;gap:4px;padding:16px;overflow-y:auto;}
  .gnb-drawer.open{display:none!important;}.gnb-drawer{display:none!important;}
  .gnb-drawer .navlink{height:auto;font-size:18px;padding:16px;color:#fff;}
  .gnb-drawer .navlink::after{display:none!important;}
  .gnb-drawer .navlink:hover{background:rgba(26,111,255,0.06);}
  .gnb-search-overlay{display:none;position:fixed;top:0;left:0;right:0;z-index:60;background:var(--ink-2);}
  .gnb-search-overlay.open{display:block;}
  .gnb-search-overlay__bar{display:flex;align-items:center;height:64px;padding:0 16px;gap:12px;}
  .gnb-search-overlay__input{flex:1;height:44px;border:0;background:rgba(255,255,255,0.08);color:#fff;font-family:var(--font-sans);font-size:15px;padding:0 16px;border-radius:8px;outline:none;}
  .gnb-search-overlay__input::placeholder{color:rgba(255,255,255,0.35);}
  .gnb-search-overlay__cancel{border:0;background:transparent;color:var(--azure);font-family:var(--font-sans);font-size:15px;font-weight:600;cursor:pointer;padding:0 8px;white-space:nowrap;}
  @media(max-width:1024px){
    .gnb-nav{display:none!important;} .gnb-right{display:none!important;} .gnb-burger{display:flex!important;} .gnb-search-mobile{display:flex!important;} .gnb-logo-full{display:none!important;} .gnb-logo-symbol{display:block!important;} }
  @media(min-width:881px){ .gnb-drawer{display:none!important;} .gnb-search-overlay{display:none!important;} }
</style>
</helmet>

<script>

/* ===== Vault Submission Detail — scenario state machine ===== */
var AZ='var(--azure)',POS='var(--pos)',NEG='var(--neg)',AMB='var(--amber)',DIM='rgba(255,255,255,0.3)';
var C_CHAR={name:'1999 POKEMON BASE SET 1ST EDITION #4 CHARIZARD HOLO',img:'images/card-charizard.png',grade:'PSA 10',cert:'12345678'};
var C_PIKA={name:'2023 POKEMON PROMO SVP #085 PIKACHU VAN GOGH',img:'images/card-pikachu.png',grade:'PSA 9',cert:'22938102'};
var C_LEB={name:'2003 TOPPS CHROME #111 LEBRON JAMES ROOKIE',img:'images/card-lebron.png',grade:'PSA 10',cert:'55501248'};
var PKG_CARDS=[C_CHAR,C_PIKA,C_LEB];
var isMobileView=function(){return window.innerWidth<=1024;};

function circleHtml(state){
  if(state==='done') return '<div class="circle circle--done"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg></div>';
  if(state==='active') return '<div class="circle circle--active"><span class="step-spinner"></span></div>';

  return h;
}
function selectPc(id){ var c=pcCards.filter(function(x){return x.id===id;})[0]; if(!c)return; pcSelected=id; renderPcList();
  if(isMobileView()){ document.getElementById('lb-sheet-content').innerHTML=pcDetailHtml(c); openLmSheet(); }
  else{ var r=document.getElementById('lb-right'); r.classList.add('selected'); r.innerHTML='<div class="lb-panel-inner" style="opacity:0;">'+pcDetailHtml(c)+'</div>'; r.scrollTop=0; requestAnimationFrame(function(){ var inner=r.querySelector('.lb-panel-inner'); if(inner) inner.style.opacity='1'; }); }
}
function pcFilterClick(e){ var el=e.target.closest('[data-lm-filter]'); if(!el)return; pcFilter=el.dataset.lmFilter; renderPcPills(); renderPcTabs(); renderPcList(); }
function openLmSheet(){ document.getElementById('lb-sheet-overlay').classList.add('open'); document.getElementById('lb-sheet').classList.add('open'); }
function closeLmSheet(){ document.getElementById('lb-sheet-overlay').classList.remove('open'); document.getElementById('lb-sheet').classList.remove('open'); }

function perCardShell(sc){
  return '<div style="max-width:1400px;margin:0 auto;">'+headerBlock()+'<div class="submission-layout"><div class="left-col">'+heroBox(sc.hero)+stepBar(sc.steps)+'<div id="lm-pills" style="display:grid;grid-template-columns:repeat('+sc.pillCols+',1fr);gap:10px;margin-bottom:16px;"></div><div id="lm-tabs" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;"></div><div id="lm-list" class="lm-list-scroll card-list"></div><div style="margin-top:12px;">'+notifBanner(sc.notif)+'</div></div><div class="right-panel" id="lb-right"><div id="lb-empty" class="lb-panel-inner"><div style="text-align:center;color:rgba(255,255,255,0.3);font-size:14px;"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" style="margin-bottom:14px;"><rect x="3" y="4" width="14" height="18" rx="2"/><rect x="8" y="6" width="13" height="17" rx="2"/></svg><div>Select a card<br>from the list to<br>view details</div></div></div><div id="lb-detail" class="lb-panel-inner" style="display:none;"></div></div></div>'+ctaRow(sc.cta)+'</div>';
}
function initPerCard(sc){ pcCards=buildPcCards(sc); pcStage=sc.stage; pcFilter='all'; pcSelected=null; renderPcPills(); renderPcTabs(); renderPcList();
  document.getElementById('lm-pills').addEventListener('click',pcFilterClick);
  document.getElementById('lm-tabs').addEventListener('click',pcFilterClick);
  document.getElementById('lm-list').addEventListener('click',function(e){var r=e.target.closest('[data-lm-id]'); if(r) selectPc(parseInt(r.dataset.lmId));});
}
function renderScenario(key){ var sc=SCEN[key]; if(!sc)return; var root=document.getElementById('sd-root');
  if(sc.layout==='A'){ root.innerHTML='<div style="max-width:760px;margin:0 auto;">'+headerBlock()+heroBox(sc.hero)+stepBar(sc.steps)+packageInfoCard()+(sc.ship?trackingCard(sc.ship):'')+notifBanner(sc.notif)+ctaRow(sc.cta)+'</div>'; }
  else { root.innerHTML=perCardShell(sc); initPerCard(sc); }
  document.querySelectorAll('#sd-switcher button').forEach(function(b){ b.classList.toggle('on', b.dataset.scen===key); });
  window.__sdCur=key;
}
/* document-level delegation survives x-dc hydration node swaps */
document.addEventListener('click',function(e){ var b=e.target.closest&&e.target.closest('#sd-switcher [data-scen]'); if(b) renderScenario(b.dataset.scen); });
document.addEventListener('click',function(e){ if(e.target.id==='lb-sheet-overlay') closeLmSheet(); });
function wireSheetDrag(){ var sheet=document.getElementById('lb-sheet'); if(!sheet||sheet.__wired)return; sheet.__wired=true; var handle=sheet.querySelector('.lb-sheet-handle'); var sY=0,cY=0,dg=false;
  handle.addEventListener('touchstart',function(e){dg=true;sY=e.touches[0].clientY;sheet.style.transition='none';},{passive:true});
  handle.addEventListener('touchmove',function(e){if(!dg)return;cY=e.touches[0].clientY-sY;if(cY<0)cY=0;sheet.style.transform='translateY('+cY+'px)';},{passive:true});
  handle.addEventListener('touchend',function(){dg=false;sheet.style.transition='';sheet.style.transform='';if(cY>100)closeLmSheet();cY=0;});
}
var __sdRT; window.addEventListener('resize',function(){ clearTimeout(__sdRT); __sdRT=setTimeout(function(){ var cur=window.__sdCur; if(SCEN[cur]&&SCEN[cur].layout==='B'){ var sel=pcSelected; renderScenario(cur); if(sel!=null) selectPc(sel); } },200); });
function initSD(){
  var h=(window.location.hash||'').replace('#','').toUpperCase();
  renderScenario(SCEN[h]?h:'G');
  wireSheetDrag();
  /* guard against late hydration wiping the render */
  var tries=0; var iv=setInterval(function(){ tries++; var root=document.getElementById('sd-root'); if(root && root.innerHTML.length<50){ renderScenario(window.__sdCur||'G'); wireSheetDrag(); } if(tries>=6) clearInterval(iv); },250);
}
if(document.readyState==='complete') setTimeout(initSD,60); else window.addEventListener('load',function(){ setTimeout(initSD,60); });

</script>
<script src="tk-wallet.js"></script>
<script src="tk-notifications.js"></script>

<script>
/* Mobile nav delegation */
(function(){
  if(window.__tkMobileNav) return; window.__tkMobileNav=true;
  document.addEventListener('click', function(e){
    var t=e.target;
    /* burger handled by tk-mobile-nav.js */
    var searchMobile=t.closest&&t.closest('.gnb-search-mobile');
    if(searchMobile){ var ov=document.getElementById('mobileSearchOverlay'); if(ov){ov.classList.add('open'); ov.querySelector('input')?.focus();} return; }
    var searchCancel=t.closest&&t.closest('.gnb-search-overlay__cancel');
    if(searchCancel){ var ov=document.getElementById('mobileSearchOverlay'); if(ov){ov.classList.remove('open'); ov.querySelector('input').value='';} return; }
  }, false);
})();
</script>
<script src="tk-role-nav.js"></script>
<script src="tk-mobile-nav.js"></script>
